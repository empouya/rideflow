services:
  database:
    image: postgres:18
    container_name: database
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  user-database:
      image: postgres:18
      container_name: user-database
      environment:
        POSTGRES_DB: ${POSTGRES_USER_DB}
        POSTGRES_USER: ${POSTGRES_USER_USER}
        POSTGRES_PASSWORD: ${POSTGRES_USER_PASSWORD}
      ports:
        - "5433:5432"
      volumes:
        - user-database:/var/lib/postgresql
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER_USER} -d ${POSTGRES_USER_DB}"]
        interval: 5s
        timeout: 5s
        retries: 5

  driver-database:
      image: postgres:18
      container_name: driver-database
      environment:
        POSTGRES_DB: ${POSTGRES_DRIVER_DB}
        POSTGRES_USER: ${POSTGRES_DRIVER_USER}
        POSTGRES_PASSWORD: ${POSTGRES_DRIVER_PASSWORD}
      ports:
        - "5434:5432"
      volumes:
        - driver-database:/var/lib/postgresql
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_DRIVER_USER} -d ${POSTGRES_DRIVER_DB}"]
        interval: 5s
        timeout: 5s
        retries: 5

  cache:
    image: redis:8.6
    container_name: cache
    ports:
      - "6379:6379"
    volumes:
      - cache:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc -w 2 localhost 2181 | grep Mode || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    ports:
      - "9094:9094"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:9094
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-topic-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka-topic-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic auth.user_registered --partitions 1 --replication-factor 1 &&
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic auth.user_logged_in --partitions 1 --replication-factor 1 &&
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic user.profile_created --partitions 1 --replication-factor 1 &&
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic user.profile_updated --partitions 1 --replication-factor 1 &&
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic driver.registered --partitions 1 --replication-factor 1 &&
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic driver.status_updated --partitions 1 --replication-factor 1 &&
      kafka-topics --bootstrap-server kafka:9092 --list
      "
    restart: "no"

  auth-service:
    image: rideflow/auth-service:latest
    container_name: auth-service
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN}
      KAFKA_BROKERS: ${KAFKA_BROKER_INTERNAL}
      KAFKA_CLIENT_ID: rideflow-auth-service
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy
    restart: unless-stopped


  user-service:
    image: rideflow/user-service:latest
    container_name: user-service
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER_USER}:${POSTGRES_USER_PASSWORD}@user-database:5432/${POSTGRES_USER_DB}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
    depends_on:
      user-database:
        condition: service_healthy
      cache:
        condition: service_healthy
    restart: unless-stopped

  driver-service:
    image: rideflow/driver-service:latest
    container_name: driver-service
    ports:
      - "3003:3003"
    environment:
      PORT: 3003
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_DRIVER_USER}:${POSTGRES_DRIVER_PASSWORD}@driver-database:5432/${POSTGRES_DRIVER_DB}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
    depends_on:
      driver-database:
        condition: service_healthy
      cache:
        condition: service_healthy
    restart: unless-stopped

  api-gateway:
    image: rideflow/api-gateway:latest
    container_name: api-gateway
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      AUTH_SERVICE_URL: http://auth-service:3001
      USER_SERVICE_URL: http://user-service:3002
      DRIVER_SERVICE_URL: http://driver-service:3003
      ALLOWED_ORIGINS: "*"
      THROTTLE_TTL: 60000
      THROTTLE_LIMIT: 100
      THROTTLE_AUTH_LIMIT: 10
    depends_on:
      auth-service:
        condition: service_started
      user-service:
        condition: service_started
      driver-service:
        condition: service_started
    restart: unless-stopped

volumes:
  database:
  user-database:
  driver-database:
  cache:
  zookeeper-data:
  zookeeper-log:
  kafka-data:
